<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patrimonio total</title>
<style>
:root{--tinta:#141414;--gris:#6b6b6b;--linea:#e6e4df;--rojo:#a3241f;--verde:#1d5c3a;--suave:#faf9f7}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--tinta);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:36px 22px 90px}
h1{font-size:24px;font-weight:650;margin:0}
h2{font-size:17px;font-weight:650;margin:34px 0 10px}
.sub{color:var(--gris);font-size:13px;margin:6px 0 0}
.controles{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--linea);border-radius:99px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--gris)}
.seg button.on{background:#141414;color:#fff}
nav{display:flex;gap:2px;margin:26px 0 0;border-bottom:1px solid var(--linea);flex-wrap:wrap}
nav button{border:none;background:none;padding:10px 14px;font-size:14.5px;cursor:pointer;color:var(--gris);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--tinta);font-weight:600;border-bottom-color:#141414}
section{display:none;padding-top:8px}
section.on{display:block}
.hero{margin:30px 0 8px}
.hero .uf{font-size:42px;font-weight:700;letter-spacing:-.5px}
.hero .eq{color:var(--gris);font-size:15px;margin-top:2px}
.kpis{display:flex;flex-wrap:wrap;gap:24px;margin:24px 0 4px}
.kpi .v{font-size:19px;font-weight:650}
.kpi .l{color:var(--gris);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;color:var(--gris);font-weight:500;font-size:12.5px;padding:6px 8px 6px 0;border-bottom:1px solid var(--linea)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--rojo)}
.pos{color:var(--verde)}
.nota{color:var(--gris);font-size:13px;margin-top:3px}
.chip{display:inline-block;font-size:11.5px;color:var(--gris);border:1px solid var(--linea);border-radius:99px;padding:1px 9px;margin-left:8px;vertical-align:2px}
.dist{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin:14px 0}
.leyenda{font-size:13.5px}
.leyenda div{margin:4px 0;display:flex;align-items:center;gap:8px}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.prop,.card{border:1px solid var(--linea);border-radius:10px;padding:16px 18px;margin:14px 0}
.prop h3,.card h3{margin:0;font-size:15.5px}
.prop .uso{color:var(--gris);font-size:13px;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;font-size:14px}
.grid .l{color:var(--gris);font-size:11.5px}
.grid .v{font-weight:600;font-variant-numeric:tabular-nums}
.wf{margin:16px 0}
.wf .fila{display:grid;grid-template-columns:180px 1fr 175px;gap:12px;align-items:center;margin:7px 0;font-size:13.5px}
.wf .pista{background:#f0eeea;border-radius:4px;height:14px;overflow:hidden}
.wf .barra{height:100%;border-radius:4px;background:#141414}
.wf .roja{background:var(--rojo)}
.wf .verde{background:var(--verde)}
.wf .punteada{background:repeating-linear-gradient(45deg,#c9c6bd 0 6px,#e6e4df 6px 12px)}
.wf .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
.wf .val small{color:var(--gris);font-size:11.5px;display:block}
input[type=number],input[type=text]{border:1px solid var(--linea);border-radius:7px;padding:6px 9px;font-size:14px;width:110px;font-variant-numeric:tabular-nums}
input[type=range]{width:220px;accent-color:#141414}
.preset{border:1px solid var(--linea);background:var(--suave);border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer;margin-right:6px}
ul{margin:8px 0;padding-left:20px;color:var(--gris);font-size:13.5px}
li{margin:4px 0}
.pie{color:var(--gris);font-size:12.5px;margin-top:46px;border-top:1px solid var(--linea);padding-top:14px}
.tip{border-bottom:1px dotted #9a988f;cursor:help;position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#141414;color:#fff;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.45;
  width:min(260px,72vw);white-space:normal;opacity:0;visibility:hidden;transition:opacity .12s;z-index:9;
  text-align:left;font-weight:400;pointer-events:none}
.tip:hover::after,.tip:focus::after{opacity:1;visibility:visible}
td:first-child .tip::after,th:first-child .tip::after{left:0;transform:none}
td.num .tip::after,th.num .tip::after{left:auto;right:0;transform:none}
#gate{max-width:340px;margin:18vh auto;padding:0 22px;text-align:center}
#gate h1{font-size:20px}
#gate input{width:100%;margin-top:18px;padding:10px 12px;font-size:16px;border:1px solid var(--linea);border-radius:8px;text-align:center}
#gate button{width:100%;margin-top:10px;padding:10px;font-size:15px;border:none;border-radius:8px;background:#141414;color:#fff;cursor:pointer}
#gerr{color:var(--rojo);font-size:13.5px;min-height:20px;margin-top:10px}
@media (max-width:600px){.hero .uf{font-size:32px}.wf .fila{grid-template-columns:105px 1fr 130px}}
</style>
</head>
<body>
<div id="gate">
  <h1>Patrimonio total</h1>
  <p class="sub">Contenido cifrado. Ingresa la clave.</p>
  <input id="clave" type="password" autocomplete="current-password" placeholder="Clave">
  <button id="entrar">Entrar</button>
  <p id="gerr"></p>
</div>
<div class="wrap" id="app" hidden></div>

function b64a(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function descifrar(clave){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(clave),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64a(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64a(PAYLOAD.iv)},key,b64a(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function modelo(c){
  const props=D.props.map(p=>{
    const cons=p.mercado*(1-c), equity=cons-p.saldo;
    return {...p, cons, equity, equity_clp:equity*UFv};
  });
  const inmoClp=props.reduce((s,p)=>s+p.equity_clp,0);
  const bloques=[];
  for(const b of D.bloques_otros) bloques.push({nombre:b.nombre,clp:b.clp,items:b.items,pos:b.pos});
  bloques.push({nombre:"Inmobiliario (equity)",clp:inmoClp,pos:4,
    items:props.map(p=>({n:p.n+" — "+p.dir,clp:p.equity_clp,f:"hoy",orig:nf0.format(Math.round(p.equity))+" UF",
      d:"Equity: "+nf0.format(Math.round(p.cons))+" UF valorización − "+nf2.format(p.saldo)+" UF de hipoteca."}))});
  bloques.sort((a,b)=>a.pos-b.pos);
  const activos=bloques.reduce((s,b)=>s+b.clp,0);
  bloques.forEach(b=>b.pct=b.clp/activos*100);
  const pasivos=D.pasivos.reduce((s,p)=>s+p.clp,0);
  const consTot=props.reduce((s,p)=>s+p.cons,0);
  const hipTot=props.reduce((s,p)=>s+p.saldo,0);
  return {props,bloques,activos,pasivos,neto:activos-pasivos,
    pctEquity:inmoClp/activos*100,
    pctBruto:consTot/(activos/UFv+hipTot)*100};
}

function donut(bloques){
  const R=62,C=2*Math.PI*R;let off=0,segs="";
  bloques.forEach((b,k)=>{
    const largo=b.pct/100*C;
    segs+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${COL[k%COL.length]}" stroke-width="26"
      stroke-dasharray="${largo} ${C-largo}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;
    off+=largo;
  });
  return `<svg width="160" height="160" viewBox="0 0 160 160" role="img">${segs}</svg>`;
}

  h+=`<div class="kpis">
  <div class="kpi"><div class="v">${dual(m.activos)}</div><div class="l">${tip("Activos",T.activos)}</div></div>
  <div class="kpi"><div class="v neg">−${dual(m.pasivos)}</div><div class="l">${tip("Pasivos externos",T.pasivos)}</div></div>
  <div class="kpi"><div class="v">${nf1.format(m.pctEquity)}%</div><div class="l">${tip("Ladrillo (equity / activos)",T.ladrillo)}</div></div>
  <div class="kpi"><div class="v">${nf1.format(m.pctBruto)}%</div><div class="l">${tip("Ladrillo bruto",T.ladrilloBruto)}</div></div></div>`;

  h+=`</div></div>`;
  h+=`<table><tr><th>Bloque</th><th class="num">${tip("UF",T.uf)}</th><th class="num">Pesos</th><th class="num">%</th></tr>`;

  h+=`<tr><td><b>${tip("Total activos",T.activos)}</b></td><td class="num"><b>${dUF(m.activos)}</b></td><td class="num"><b>${fM(m.activos)}</b></td><td class="num">100%</td></tr>`;
  D.pasivos.forEach(p=>{h+=`<tr><td class="neg">${esc(p.n)}</td><td class="num neg">−${dUF(p.clp)}</td><td class="num neg">−${fM(p.clp)}</td><td class="num"></td></tr>`});
  h+=`<tr><td><b>${tip("Patrimonio neto",T.neto)}</b></td><td class="num"><b>${dUF(m.neto)}</b></td><td class="num"><b>${fM(m.neto)}</b></td><td class="num"></td></tr></table>`;
  return h;
}

function rInmo(m){
  const totInv=m.props.reduce((s,p)=>s+p.inv_uf,0);
  const totMer=m.props.reduce((s,p)=>s+p.mercado,0);
  const totGan=totMer-totInv;
  let h=`<div class="kpis">
  <div class="kpi"><div class="v">${fUF(totInv)} · ${fM(totInv*UFv)}</div><div class="l">Total invertido (compras + mejoras)</div></div>
  <div class="kpi"><div class="v">${fUF(totMer)} · ${fM(totMer*UFv)}</div><div class="l">Valor de mercado hoy (tu estimación)</div></div>
  <div class="kpi"><div class="v pos">+${fUF(totGan)} · ${fM(totGan*UFv)} (+${nf1.format(totGan/totInv*100)}%)</div><div class="l">${tip("Ganancia en UF",T.ganUF)}</div></div></div>`;
  for(const p of m.props){
    h+=`<div class="prop"><h3>${esc(p.n)} <span class="chip">crédito ${esc(p.credito)}</span></h3>
    <div class="uso">${esc(p.dir)} · ${esc(p.uso)}</div>
    <div class="grid">
    <div><div class="l">Mercado (tu estimación)</div><div class="v">${fUF(p.mercado)} · ${fM(p.mercado*UFv)}</div></div>
    <div><div class="l">${tip("Valorización usada"+(state.castigo>0?" (−10%)":" (mercado)"),T.valorizacion)}</div><div class="v">${fUF(p.cons)} · ${fM(p.cons*UFv)}</div></div>
    <div><div class="l">${tip("Hipoteca (saldo)",T.hipoteca)}</div><div class="v neg">−${nf2.format(p.saldo)} UF · −${fM(p.saldo*UFv)}</div></div>
    <div><div class="l">${tip("Equity",T.equity)}</div><div class="v">${fUF(p.equity)} · ${fM(p.equity_clp)}</div></div>
    <div><div class="l">${tip("Dividendo",T.dividendo)}</div><div class="v">${nf2.format(p.div_uf)} UF ≈ ${fCLP(p.div_uf*UFv)}/mes</div></div>
    <div><div class="l">${tip("Cuota · CAEV",T.cuota)}</div><div class="v">${esc(p.cuota)} · ${esc(p.caev)}</div></div>`;
    if(p.arr_clp>0){h+=`<div><div class="l">Arriendo</div><div class="v">${fCLP(p.arr_clp)}/mes</div></div>
    <div><div class="l">${tip("Rentabilidad bruta arriendo",T.yieldArr)}</div><div class="v">${nf1.format(p.yield_pct)}% anual</div></div>`;}
    h+=`</div>
    <h2 style="margin-top:18px;font-size:14.5px">Cuánto has ganado desde la compra</h2>
    <div class="nota">${esc(p.compra_desc)}</div>
    <div class="grid" style="margin-top:10px">
    <div><div class="l">Invertido total</div><div class="v">${fUF(p.inv_uf)} · ${fM(p.inv_uf*UFv)}</div></div>
    <div><div class="l">Vale hoy (mercado)</div><div class="v">${fUF(p.mercado)} · ${fM(p.mercado*UFv)}</div></div>
    <div><div class="l">${tip("Ganancia en UF",T.ganUF)}</div><div class="v ${p.gan_uf>=0?"pos":"neg"}">${p.gan_uf>=0?"+":""}${fUF(p.gan_uf)} · ${fM(p.gan_uf*UFv)} (${p.gan_uf>=0?"+":""}${nf1.format(p.gan_pct)}%)</div></div>
    <div><div class="l">${tip("Ritmo anual ("+p.anios+" años)",T.ritmo)}</div><div class="v">${nf1.format(p.cagr_pct)}% en UF</div></div>`;
    if(p.compra_clp){h+=`<div><div class="l">${tip("En pesos nominales",T.nominal)}</div><div class="v">${fCLP(p.compra_clp)} → ${fCLP(p.hoy_clp)} (+${nf0.format((p.hoy_clp/p.compra_clp-1)*100)}%)</div></div>`;}
    h+=`</div><div class="nota">Ganancia contra tu estimación de mercado, sin descontar dividendos pagados ni costo del crédito.</div></div>`;
  }
  return h;
}

function rFlujo(){
  const g=D.genoma;
  let h=`<div class="kpis">
  <div class="kpi"><div class="v">${dual(g.rec_tot)}</div><div class="l">${tip("Recibido (1ª + 2ª cuota)",T.recibido)}</div></div>
  <div class="kpi"><div class="v neg">−${dual(g.gas_tot)} (${nf1.format(g.gas_pct)}%)</div><div class="l">${tip("Gastado",T.gastado)}</div></div>
  <div class="kpi"><div class="v">${dual(g.neto_trab)}</div><div class="l">${tip("Quedó trabajando",T.quedo)}</div></div>
  <div class="kpi"><div class="v pos">${dual(g.propio_hoy)} (+${nf1.format(g.rentab_pct)}%)</div><div class="l">${tip("Eso vale hoy",T.valeHoy)}</div></div></div>`;
  const base=g.rec_tot;
  const fila=(lbl,val,cls,w)=>`<div class="fila"><div>${lbl}</div><div class="pista"><div class="barra ${cls}" style="width:${Math.min(w,100)}%"></div></div><div class="val">${fM(val)}<small>${dUF(val)}</small></div></div>`;
  h+=`<div class="wf">`;
  h+=fila(tip("Recibido",T.recibido),g.rec_tot,"",100);
  h+=fila(tip("Gastado",T.gastado),g.gas_tot,"roja",g.gas_tot/base*100);
  h+=fila(tip("Quedó trabajando",T.quedo),g.neto_trab,"",g.neto_trab/base*100);
  h+=fila(tip("Vale hoy",T.valeHoy),g.propio_hoy,"verde",g.propio_hoy/base*100);
  h+=fila(tip("Por venir (3ª cuota)",T.porVenir),g.pv_clp,"punteada",g.pv_clp/base*100);
  h+=`</div>`;
  h+=`<h2>Entradas</h2><table><tr><th>Cuota</th><th class="num">${tip("UF",T.uf)}</th><th class="num">Pesos</th></tr>`;
  g.recibido.forEach(r=>{h+=`<tr><td><b>${esc(r.n)}</b> <span class="chip">${esc(r.f)}</span><div class="nota">${esc(r.d)}</div></td><td class="num">${dUF(r.clp)}</td><td class="num">${fM(r.clp)}</td></tr>`});
  h+=`</table><h2>Salidas (gastado)</h2><table><tr><th>Destino</th><th class="num">${tip("UF",T.uf)}</th><th class="num">Pesos</th></tr>`;
  g.gastado.forEach(r=>{h+=`<tr><td><b>${esc(r.n)}</b> <span class="chip">${esc(r.f)}</span><div class="nota">${esc(r.d)}</div></td><td class="num neg">−${dUF(r.clp)}</td><td class="num neg">−${fM(r.clp)}</td></tr>`});
  h+=`</table>`;
  h+=`<div class="card"><h3>Por venir: ${esc(g.pv.n)} (${esc(g.pv.f)})</h3>
  <div class="nota">${esc(g.pv.d)}</div>
  <div class="grid" style="margin-top:10px"><div><div class="l">USD</div><div class="v">USD ${nf0.format(g.pv.usd)}</div></div>
  <div><div class="l">En plata de hoy</div><div class="v">${dual(g.pv_clp)}</div></div></div></div>`;
  h+=`<p class="nota">${esc(g.nota)}</p>`;
  return h;
}

function rSim(m){
  const s=D.sim;
  let h=`<div class="card"><h3>1 · Proyectar una inversión</h3>
  <p class="nota">${esc(s.nota)}</p>
  <div style="margin:12px 0">
  ${s.presets.map(p=>`<button class="preset" data-m="${p.m}">${esc(p.l)}</button>`).join("")}
  </div>
  <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
  <label>Monto: $ <input type="number" id="simMonto" value="100" min="1" step="10"> M</label>
  <label>Años: <input type="range" id="simAnios" min="1" max="15" value="5"> <b id="simAniosV">5</b></label>
  </div>
  <table style="margin-top:14px"><tr><th>Alternativa</th><th class="num">${tip("Tasa real anual",T.tasaReal)}</th><th class="num">${tip("Valor final",T.valorFinal)}</th><th class="num">Ganancia</th></tr>`;
  s.alternativas.forEach((a,k)=>{
    h+=`<tr><td>${esc(a.n)}<div class="nota">${esc(a.d)}</div></td>
    <td class="num"><input type="number" class="simTasa" data-k="${k}" value="${a.tasa}" step="0.5" style="width:70px"> %</td>
    <td class="num" id="simF${k}">—</td><td class="num" id="simG${k}">—</td></tr>`;
  });
  h+=`</table><p class="nota">Resultados en plata de hoy (tasas reales sobre UF).</p></div>`;

  h+=`<div class="card"><h3>2 · ¿Cuánto ladrillo quiero?</h3>
  <p class="nota">Hoy el ${tip("equity inmobiliario",T.equity)} es el ${nf1.format(m.pctEquity)}% de tus activos. Mueve la meta y mira cuánta plata habría que mover.</p>
  <label>Meta: <input type="range" id="metaPct" min="0" max="60" value="${Math.round(m.pctEquity)}"> <b id="metaPctV">${Math.round(m.pctEquity)}%</b></label>
  <p id="metaOut" style="font-size:15px;margin:10px 0 2px"></p>
  <p class="nota">Cálculo simple: mover equity entre lo financiero y propiedades, activos totales constantes.</p></div>`;

  h+=`<div class="card"><h3>3 · ¿Prepagar hipotecas o invertir?</h3>
  <p class="nota">Debes ${nf2.format(s.saldo_hip_uf)} UF (${fM(s.saldo_hip_uf*UFv)}) en hipotecas a ${tip("CAEV",T.cuota)} promedio ${nf1.format(s.caev_pond)}%. Si tu inversión rinde más que eso, conviene invertir; si rinde menos, prepagar.</p>
  <label>Retorno esperado de tu inversión: <input type="number" id="ppTasa" value="4.0" step="0.5" style="width:70px"> % ${tip("real",T.tasaReal)}</label>
  <p id="ppOut" style="font-size:15px;margin:10px 0 2px"></p></div>`;
  return h;
}

function rDetalle(m){
  let h=`<table><tr><th>Ítem</th><th class="num">${tip("Valor origen",T.origen)}</th><th class="num">${tip("UF",T.uf)}</th><th class="num">Pesos</th></tr>`;
  for(const b of m.bloques){for(const i of b.items){
    h+=`<tr><td><b>${esc(i.n)}</b> <span class="chip">${esc(b.nombre)} · ${esc(i.f)}</span><div class="nota">${esc(i.d)}</div></td>
    <td class="num">${i.orig?esc(i.orig):"—"}</td><td class="num">${dUF(i.clp)}</td><td class="num">${fM(i.clp)}</td></tr>`;
  }}
  D.pasivos.forEach(p=>{h+=`<tr><td class="neg"><b>${esc(p.n)}</b> <span class="chip">pasivo · ${esc(p.f)}</span><div class="nota">${esc(p.d)}</div></td>
  <td class="num">${p.orig?esc(p.orig):"—"}</td><td class="num neg">−${dUF(p.clp)}</td><td class="num neg">−${fM(p.clp)}</td></tr>`});
  h+=`</table>`;
  h+=`<h2>Criterios</h2><ul>${D.criterios.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`;
  h+=`<h2>Qué queda fuera</h2><ul>${D.exclusiones.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`;
  return h;
}

function simCalcular(m){
  const monto=(parseFloat(document.getElementById("simMonto").value)||0)*1e6;
  const anios=parseInt(document.getElementById("simAnios").value);
  document.getElementById("simAniosV").textContent=anios;
  document.querySelectorAll(".simTasa").forEach(inp=>{
    const k=inp.dataset.k, r=(parseFloat(inp.value)||0)/100;
    const fin=monto*Math.pow(1+r,anios);
    document.getElementById("simF"+k).textContent=fM(fin)+" · "+dUF(fin);
    const g=document.getElementById("simG"+k);
    g.textContent=(fin>=monto?"+":"")+fM(fin-monto);
    g.className="num "+(fin>=monto?"pos":"neg");
  });
  const meta=parseInt(document.getElementById("metaPct").value);
  document.getElementById("metaPctV").textContent=meta+"%";
  const inmoClp=m.activos*m.pctEquity/100;
  const dif=m.activos*meta/100-inmoClp;
  const out=document.getElementById("metaOut");
  if(Math.abs(dif)<m.activos*0.005){out.textContent="Ya estás en la meta.";}
  else if(dif>0){out.innerHTML=`Comprar <b>${dual(dif)}</b> más de propiedad (equity), p. ej. moviéndolo desde lo financiero.`;}
  else{out.innerHTML=`Reducir ladrillo en <b>${dual(-dif)}</b> (vender o hipotecar) y pasarlo a financiero.`;}
  const rp=parseFloat(document.getElementById("ppTasa").value)||0;
  const difUF=D.sim.saldo_hip_uf*(rp-D.sim.caev_pond)/100;
  const pp=document.getElementById("ppOut");
  if(difUF>=0){pp.innerHTML=`Invirtiendo a ${nf1.format(rp)}% ganas <b class="pos">+${nf0.format(difUF)} UF/año</b> (≈ ${fM(difUF*UFv)}) más que prepagando.`;}
  else{pp.innerHTML=`A ${nf1.format(rp)}% te conviene <b>prepagar</b>: ahorras <b class="pos">${nf0.format(-difUF)} UF/año</b> (≈ ${fM(-difUF*UFv)}).`;}
}

function pintar(){
  const m=modelo(state.castigo);
  const renders=[rResumen,rInmo,rFlujo,rSim,rDetalle];
  D.tabs.forEach((t,k)=>{document.getElementById("t-"+t[0]).innerHTML=renders[k].length?renders[k](m):renders[k]()});
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===state.tab));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="t-"+state.tab));
  document.querySelectorAll("#segVal button").forEach(b=>b.classList.toggle("on",parseFloat(b.dataset.c)===state.castigo));
  const sim=document.getElementById("t-"+D.tabs[3][0]);
  sim.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>simCalcular(m)));
  sim.querySelectorAll(".preset").forEach(b=>b.addEventListener("click",()=>{document.getElementById("simMonto").value=b.dataset.m;simCalcular(m)}));
  simCalcular(m);
}

function armar(d){
  D=d; UFv=d.ind.uf; USDv=d.ind.usd; state.castigo=d.castigo;
  const app=document.getElementById("app");
  app.hidden=false;
  app.innerHTML=`<h1>Patrimonio total</h1>
  <p class="sub">${esc(d.titular)} · UF $${nf2.format(UFv)} y dólar $${nf2.format(USDv)} al ${esc(d.ind.fecha)} (${esc(d.ind.origen)}) · generado ${esc(d.generado)}</p>
  <div class="controles">
    <span class="seg" id="segVal">
      <button data-c="0.1">Conservador −10%</button><button data-c="0">Mercado pleno</button>
    </span>
    ${tip("¿qué es esto?","«Conservador −10%» valoriza tus propiedades un 10% bajo tu estimación de mercado, para no inflar el patrimonio. «Mercado pleno» las usa tal cual. Los montos aparecen siempre en UF y en pesos; pasa el mouse (o toca) los textos punteados para ver explicaciones.")}
  </div>
  <nav id="tabs">${d.tabs.map(t=>`<button data-t="${t[0]}">${esc(t[1])}</button>`).join("")}</nav>
  ${d.tabs.map(t=>`<section id="t-${t[0]}"></section>`).join("")}
  <p class="pie">Fuente única: patrimonio.json (local, nunca en el repo). Para actualizar: editar el JSON → correr generar_patrimonio.py → publicar con «publica».</p>`;
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{state.tab=b.dataset.t;location.hash=state.tab;pintar()}));
  document.querySelectorAll("#segVal button").forEach(b=>b.addEventListener("click",()=>{state.castigo=parseFloat(b.dataset.c);pintar()}));
  if(location.hash){const t=location.hash.slice(1);if(d.tabs.some(x=>x[0]===t))state.tab=t;}
  pintar();
}

async function intentar(){
  const err=document.getElementById("gerr");
  err.textContent="";
  try{
    const d=await descifrar(document.getElementById("clave").value);
    document.getElementById("gate").remove();
    armar(d);
  }catch(e){err.textContent="Clave incorrecta.";}
}
document.getElementById("entrar").addEventListener("click",intentar);
document.getElementById("clave").addEventListener("keydown",e=>{if(e.key==="Enter")intentar()});
document.getElementById("clave").focus();
</script>
</body>
